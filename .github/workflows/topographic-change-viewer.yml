name: Deploy topographic change viewer

on:
  push:
    branches: [main]
    paths:
      - "topographic_change_map/viewer/**"
      - "topographic_change_map/package.json"
      - "topographic_change_map/package-lock.json"
      - "topographic_change_map/vite.config.ts"
      - ".github/workflows/topographic-change-viewer.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: topographic_change_map/package-lock.json
      - name: Install dependencies
        run: npm ci
        working-directory: topographic_change_map
      - name: Build viewer
        run: npm run viewer:build
        working-directory: topographic_change_map
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: topographic_change_map/viewer/dist
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

# Source registry for data_aggregator — the pollable subset of
# ../aryaa_research_general/11-data-catalogue-2026-08-29.md
#
# Fields
#   id        stable slug
#   family    json_api | post_api | rss | html | s3 | gcs | stac | pdf | fdsn | mediawiki
#   url       endpoint or page (templated where noted)
#   auth      none | key | account | browser_ua
#   cadence   poll interval
#   format    what comes back
#   holds     one line
#   pii       true if rows contain names/phones/photos — process in memory, never persist rows
#   parser    notes for the normaliser
#   catalogue row id in 11-data-catalogue-2026-08-29.md
#   verified  2026-08-29 fetch status: C confirmed | R reported | U unconfirmed
#
# Everything here was reachable without login on 2026-08-29 unless auth says otherwise.

version: 2026-08-29
sources:

# ── 1. Person / status registries ─────────────────────────────────────────────

- id: opmcm_stats
  family: json_api
  url: https://rescue.opmcm.gov.np/api/stats
  auth: none
  cadence: 30m
  format: json
  holds: totals — persons lost/found/rescued, last24h, withoutContact, help requests/offers
  pii: false
  parser: flat object; keep every counter with fetch timestamp
  catalogue: A1
  verified: C

- id: opmcm_person_reports
  family: json_api
  url: https://rescue.opmcm.gov.np/api/person-reports?type={lost|found|rescued}&limit=200&page={n}
  auth: none
  cadence: 60m
  format: json (photos inlined as base64 — keep limit<=200)
  holds: person reports with fullName, locationText, daoOffice, source, status, createdAt
  pii: true
  parser: aggregate only — counts by type/status/daoOffice/locationText-normalised; drop fullName/images
  catalogue: A1
  verified: C

- id: opmcm_help_requests
  family: json_api
  url: https://rescue.opmcm.gov.np/api/help-requests?page={n}&limit=200
  auth: none
  cadence: 60m
  format: json
  holds: geocoded help requests (problemType, affectedCount, urgency, district/municipality/ward, Point)
  pii: true
  parser: prestore drops reporterName/phone/thumbnail/title/description and keeps gazetteer place_ids; figures help_requests_open/critical + people_affected_reported per place / district / problem / help-type scope
  catalogue: A1
  verified: 2026-08-30 (227 requests, 2 pages)

- id: opmcm_government_efforts
  family: json_api
  url: https://rescue.opmcm.gov.np/api/government-efforts
  auth: none
  cadence: 6h
  format: json
  holds: official notices mirrored from nepal.gov.np
  pii: false
  parser: articles (ne) through the relevance gate, url = portal anchor + nepalRef; figure government_notices_total
  catalogue: A1
  verified: 2026-08-30 (94 notices)

- id: ndrrma_rescues
  family: json_api
  url: https://ndrrma.gov.np/api/v1/rescues/{rescued-persons/?limit=500&offset={n} | status-counts/ | rescued-statistics/ | rescued-locations/ | stationed-locations/}
  auth: none
  cadence: 30m
  format: json (DRF)
  holds: named rescued register; counts; 21 rescue sites + 11 stationing sites with centroids
  pii: true   # rescued-persons only; the location endpoints are clean
  parser: persons → counts by nationality/status/rescued_location/stationed_location; locations → gazetteer seeds
  catalogue: A2 / B3
  verified: C

- id: setu_recordlist
  family: html
  url: https://setu.ndrrma.gov.np/admin/recordlist.php
  auth: none
  cadence: 2h
  format: html card list
  holds: NDRRMA family-intake records (missing/found/safe/rescued)
  pii: true
  parser: count cards by status; no row storage
  catalogue: A3
  verified: C

- id: police_udb
  family: html
  url: https://udb.nepalpolice.gov.np/{dead-bodies-lists|missing|found}?province_id=&district_id=&date_from=2026-08-26   # districts via GET /get-district/{province_id}
  auth: none (self-signed TLS — curl -k)
  cadence: daily
  format: html, 20 rows/page
  holds: unidentified bodies (photo, sex, place found), missing, found
  pii: true
  parser: page counts per district + place-found distribution only; never store photos/names
  catalogue: A4 / A20
  verified: C

- id: volunteer_bulletin_repo
  family: s3   # raw.githubusercontent
  url:   # contents listing + the count-bearing files (family.json / *.json name lists are deliberately not pulled)
    - https://api.github.com/repos/nirajbhusal/rasuwa-flood-bulletin/contents/
    - https://raw.githubusercontent.com/nirajbhusal/rasuwa-flood-bulletin/main/ndrrma-rescue.csv
    - https://raw.githubusercontent.com/nirajbhusal/rasuwa-flood-bulletin/main/army-heli-rescue.csv
    - https://raw.githubusercontent.com/nirajbhusal/rasuwa-flood-bulletin/main/rasuwa-foreign-rescued.csv
    - https://raw.githubusercontent.com/nirajbhusal/rasuwa-flood-bulletin/main/rasuwa-hospital-dhunche.csv
    - https://raw.githubusercontent.com/nirajbhusal/rasuwa-flood-bulletin/main/dhm-rivers.json
  auth: none
  cadence: 60m
  format: csv/json
  holds: normalised copies of official lists + family registry; 716-commit history of list changes
  pii: true
  parser: prestore() projects every CSV to {rows, columns, counts of safe columns}; figures = row counts, status/nationality/location distributions, dhm-rivers levels
  catalogue: A8
  verified: C


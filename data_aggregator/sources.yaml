    - https://bipadportal.gov.np/api/v1/river/?station=105&water_level_on__gt=2026-08-25&ordering=-water_level_on&limit=60
    - https://bipadportal.gov.np/api/v1/river/?station=281&water_level_on__gt=2026-08-25&ordering=-water_level_on&limit=60
    - https://bipadportal.gov.np/api/v1/river/?station=261&water_level_on__gt=2026-08-25&ordering=-water_level_on&limit=60
    - https://bipadportal.gov.np/api/v1/river/?station=67&water_level_on__gt=2026-08-25&ordering=-water_level_on&limit=60
    - https://bipadportal.gov.np/api/v1/river/?station=25&water_level_on__gt=2026-08-25&ordering=-water_level_on&limit=60

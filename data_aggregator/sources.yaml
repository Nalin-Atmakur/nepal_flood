  catalogue: C6 / C8
  verified: 2026-08-30 (1 polygon, 37.4 km²)

- id: vantor_stac
  family: stac
  url: https://vantor-opendata.s3.amazonaws.com/events/Nepal-Flooding-Aug-2026/collection.json
  auth: none (CC-BY-NC)

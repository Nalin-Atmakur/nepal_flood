    - https://bipadportal.gov.np/api/v1/river/?station=171&water_level_on__gt=2026-08-25&ordering=-water_level_on&limit=60
    - https://bipadportal.gov.np/api/v1/river/?station=74&water_level_on__gt=2026-08-25&ordering=-water_level_on&limit=60
    - https://bipadportal.gov.np/api/v1/river/?station=49&water_level_on__gt=2026-08-25&ordering=-water_level_on&limit=60
